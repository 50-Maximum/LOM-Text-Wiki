<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>活侠传追踪Wiki</title>
<style>
:root{
  --bg:#141619; --panel:#1b1e23; --line:#282c33; --fg:#d9dde3; --dim:#8a93a1;
  --acc:#c8a06a; --narr:#7f8b99; --think:#6fa8dc; --center:#b58cd6;
  --link:#9fc4e8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.8 "Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:18px;padding:12px 26px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .brand{font-size:16px;color:var(--acc);font-weight:600;letter-spacing:.06em;white-space:nowrap}
header .brand a{color:var(--acc)}
#q{width:340px;max-width:42vw;padding:7px 12px;background:#111316;border:1px solid var(--line);
  color:var(--fg);border-radius:5px;outline:none}
#q:focus{border-color:var(--acc)}
nav{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--dim)}
nav a{color:var(--dim)}
nav a:hover{color:var(--acc)}
#layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 57px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px 40px;overflow:auto}
main{overflow:auto;padding:26px 40px 100px}
.wrap{max-width:940px;margin:0 auto}
aside .grp{font-size:12px;color:#69707c;letter-spacing:.08em;margin:14px 8px 6px}
aside .item{display:block;padding:4px 9px;border-radius:4px;color:var(--dim);font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
aside .item:hover{background:#232830;color:var(--fg);text-decoration:none}
aside .item.on{background:#2b3038;color:var(--acc)}
aside .item .n{float:right;color:#5b6270;font-size:11px}
aside .search-sm{width:100%;padding:6px 9px;background:#111316;border:1px solid var(--line);
  color:var(--fg);border-radius:4px;margin-bottom:6px;outline:none;font-size:13px}
h1{font-size:26px;margin:0 0 4px;color:#f0e6d2;font-weight:600;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.sub .tag{display:inline-block;background:#2a2118;color:var(--acc);border-radius:3px;
  padding:1px 8px;font-size:12px;margin-right:8px}
.lead{font-size:15.5px;line-height:1.95;margin:12px 0 20px;color:#e3e7ec}
.lead sup.fn{cursor:pointer;color:#e8b04b;font-size:10.5px;vertical-align:super;line-height:0;margin:0 1px;font-weight:600}
.note sup.fn{color:#e8b04b;font-size:11px;vertical-align:super;margin-right:3px;font-weight:600}
h2{font-size:18px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:6px;
  margin:34px 0 14px;font-weight:600}
h3{font-size:15px;color:#d9c9a8;margin:18px 0 8px}
.infobox{float:right;width:300px;margin:0 0 18px 26px;background:var(--panel);

.infobox .ttl{background:#232830;padding:8px 12px;color:var(--acc);font-weight:600;font-size:14px}
.infobox .row{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:6px 12px;
  border-top:1px solid #20242a}
.infobox .k{color:#8b93a1}
.infobox .v{color:#d5dbe2;word-break:break-word}
@media (max-width:900px){.infobox{float:none;width:auto;margin:0 0 18px}#layout{grid-template-columns:1fr}aside{display:block;position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .18s}aside.open{transform:none;box-shadow:0 0 24px #000}#tocbtn{display:flex}}
#tocbtn{display:none;position:fixed;left:14px;bottom:24px;width:40px;height:40px;border-radius:50%;background:#1d1a22;border:1px solid var(--line);color:var(--acc);align-items:center;justify-content:center;z-index:31;cursor:pointer;text-decoration:none;font-size:15px}
.note{border-left:3px solid #3a424d;padding:6px 0 6px 12px;margin:9px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}

.line{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:7px 8px 7px 10px;

b{color:#f0d9ae;font-weight:600}

.chips .clbl{color:var(--dim);font-size:12.5px;margin-right:2px}
.fchip{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border:1px solid var(--line);

#rf:hover{color:var(--acc);border-color:var(--acc);text-decoration:none}

.portrait{float:right;width:208px;max-width:32%;margin:0 0 14px 18px;border:1px solid #d8cfbc;
  border-radius:8px;background:#f6f1e5;box-shadow:0 1px 3px rgba(0,0,0,.08)}

#updchip{position:fixed;right:14px;bottom:12px;z-index:60;padding:5px 11px;border-radius:14px;background:#1b1e23;border:1px solid #282c33;color:#8a93a1;font-size:12px;cursor:pointer;user-select:none}

<body>
<header>
  <div class="brand"><a href="#/">活侠传追踪Wiki</a></div>
  <a id="rf" href="javascript:void 0" onclick="location.reload();return false" title="刷新内容">⟳</a>
  <input id="q" placeholder="搜索条目 / 人物 / 地点 / 事件…">
  <nav id="nav">
    <a href="#/">首页</a><a href="#/list/人物">人物</a><a href="#/list/势力">势力</a>
    <a href="#/list/地点">地点</a><a href="#/list/事件">事件</a><a href="#/list/剧情单元">剧情单元</a><a href="#/list/剧情段">剧情段</a><a href="#/list/地图事件">地图事件</a><a href="#/list/物品">物品</a>
    <a href="#/list/武学">武学</a><a href="#/list/数值">数值</a><a href="#/list/成就">成就</a><a href="#/chapters">原文</a>
  </nav>
</header>
<div id="backbar" class="backbar"></div>
<div id="layout">
  <aside id="side"></aside>
  <main id="main"><div class="wrap"><div class="empty">载入中…</div></div></main>
</div>
<a id="tocbtn" href="javascript:void 0" onclick="document.getElementById('side').classList.toggle('open');return false" title="目录">☰</a>
<a id="totop" href="javascript:void 0" onclick="jumpTop();return false" title="回到页面最顶端">↑</a>
<a id="tobottom" href="javascript:void 0" onclick="jumpBottom();return false" title="到页面最底端">↓</a>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=p=>fetch(p).then(r=>r.json());
const enc=s=>encodeURIComponent(s);

let NAME_LIST=[], NAME_MAP={}, NAME_RE=null, TITLES={};
// 纯身份称呼不自动链接（这些页是群像：「江湖·掌门」「市井·妇人」），点进去没有具体所指
const GENERIC_ROLES=['掌门','长老','师兄','师姐','师弟','师妹','师父','弟子','妇人','路人','乞丐',
  '店小二','大妈','少年','官兵','掌柜','少侠','家丁','护卫','差役','客人','众人','旁白','汉子',
  '老板','小厮','侍女','丫寰','仆役','老丈','姑娘','老汉','青年'];
async function loadIndex(){
  const d=await api('/api/nameindex');
  NAME_LIST=d.names||[];
  NAME_MAP={};
  for(const x of NAME_LIST) if(!NAME_MAP[x.name]) NAME_MAP[x.name]=x.slug;
  for(const s of GENERIC_ROLES) delete NAME_MAP[s];
  const names=Object.keys(NAME_MAP)
    .sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(names.length) NAME_RE=new RegExp('('+names.join('|')+')','g');
}
function brief(s,n){
  s=String(s||'').replace(/\s+/g,' ').trim();
  n=n||44;
  if(s.length<=n) return s;
  const head=s.slice(0,n);
  const cut=Math.max(head.lastIndexOf('。'),head.lastIndexOf('！'),head.lastIndexOf('？'),head.lastIndexOf('；'));
  if(cut>=n*0.5) return s.slice(0,cut+1);
  const soft=Math.max(head.lastIndexOf('，'),head.lastIndexOf('、'),head.lastIndexOf('：'));
  if(soft>=n*0.6) return s.slice(0,soft)+'…';
  return head+'…';
}
function linkify(text){
  if(!text) return '';
  if(!NAME_RE) return esc(text);
  NAME_RE.lastIndex=0;
  let out='', last=0, m;
  while((m=NAME_RE.exec(text))!==null){
    out+=esc(text.slice(last,m.index));
    const slug=NAME_MAP[m[0]];
    out+=slug?`<a class="wl" href="#/p/${enc(slug)}">${esc(m[0])}</a>`:esc(m[0]);
    last=m.index+m[0].length;
    if(m[0].length===0) NAME_RE.lastIndex++;
  }
  out+=esc(text.slice(last));
  return out;
}
function fnmark(h){
  if(!h) return h;
  return h.replace(/（(\d+)）/g,(m,n)=>`<sup class="fn" data-fn="${n}" onclick="jumpFn(this)" title="跳转脚注 ${n}">${n}</sup>`);
}
function jumpFn(el){
  const t=document.getElementById('fn-'+el.dataset.fn);
  if(t){ t.scrollIntoView({block:'center'}); t.style.background='#33291a'; setTimeout(()=>t.style.background='',1600); }
}
function secHtml(t){
  return String(t||'').replace(/\n/g,'<br>').split(/<br\s*\/?>/i).map(x=>fnmark(linkify(x))).join('<br>');
}
function rich(s){
  let t=esc(s||'');
  t=t.replace(/\{size=?(\d+)\}/g,(m,n)=>'<span style="font-size:'+Math.max(12,Math.min(34,Math.round(+n*0.6)))+'px">')
     .replace(/\{\/size\}/g,'</span>')
     .replace(/\{color=(#[0-9a-fA-F]{3,8})\}/g,'<span style="color:$1">')
     .replace(/\{\/color\}/g,'</span>')
     .replace(/\{title\}/g,'<span class="ttl">').replace(/\{\/title\}/g,'</span>')
     .replace(/\{punch=[^}]*\}/g,'<span class="punch">').replace(/\{\/punch\}/g,'</span>')
     .replace(/\{\$[^}]*\}/g,'');
  return t;
}
const badge=mode=>({narrative:'旁白',think:'心声',center:'居中',center2:'居中',character:'对白'})[mode]||'对白';
const cls=mode=>({narrative:'narr',think:'think',center:'center center2'})[mode]||'';

/* ---------- 路由 ---------- */
window.addEventListener('hashchange',route);
function go(h){ location.hash=h; }

/* ---------- 返回上一页（站内历史） ---------- */
const NAV=[]; let curHash='', navSuppress=false, navRestore=false;
const POS=new Map();
function labelOf(h){
  if(!h||h==='/') return '首页';
  const p=decodeURIComponent(h).replace(/^#/,'').split('?')[0].replace(/^#/,'').split('/');
  const kind=p[1]||'', arg=p.slice(2).join('/').split('?')[0];
  if(kind==='p') return (arg.split('/').pop()||'条目');
  if(kind==='list') return (arg||'全部')+' 列表';
  if(kind==='scene') return '场景 '+arg.split('?')[0];
  if(kind==='search') return '搜索「'+arg+'」';
  if(kind==='chapters') return '原文';
  return '首页';
}
function updateBack(){
  const el=document.getElementById('backbar');
  if(!el) return;
  const t=NAV[NAV.length-1];
  if(t && t.h!==curHash){
    el.style.display='flex';
    el.innerHTML=`<a href="javascript:void 0" onclick="goBack();return false">← 返回「${esc(t.label)}」</a>`;
  }else{
    el.style.display='none'; el.innerHTML='';
  }
}
function goBack(){
  const t=NAV.pop();
  if(!t){ history.back(); return; }
  navSuppress=true;
  navRestore=true;
  location.hash=t.h.replace(/^#/,'');
  updateBack();
}

async function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''))||'/';
  if(h!==curHash){
    if(curHash) POS.set(curHash, window.scrollY||window.pageYOffset||0);
    if(curHash && !navSuppress) NAV.push({h:curHash,label:labelOf(curHash)});
    navSuppress=false;
    curHash=h;
  }
  updateBack();
  const [_,kind,...rest]=h.split('/');
  const rawArg=rest.join('/');
  const _q=(rawArg.split('?')[1]||'');
  const arg=rawArg.split('?')[0];
  window.scrollTo(0,0); $('#main').scrollTop=0;
  try{
    if(!kind||kind==='') await home();
    else if(kind==='p' && arg==='关于本站') await home();
    else if(kind==='p') await renderPage(arg);
    else if(kind==='list'){
      const qs=new URLSearchParams(_q);
      await renderList(arg,qs.get('q')||'',parseInt(qs.get('o')||'0',10)||0,qs.get('f')||'',qs.get('f2')||'');
    }
    else if(kind==='search') await renderSearch(arg);
    else if(kind==='scene') await renderScene(arg + (_q ? ('?' + _q) : ''));
    else if(kind==='chapters') await renderChapters();
    else await home();
  } catch(err){
    $('#main').innerHTML='<div class="wrap"><div class="empty">这一页没能载入：'
      +esc(String((err&&err.message)||err))+'<br><br><a href="#/">回首页</a></div></div>';
    console.error(err);
  } finally {
    if(navRestore){
      navRestore=false;
      const y=POS.get(curHash)||0;
      const put=()=>window.scrollTo(0,y);
      requestAnimationFrame(()=>{ requestAnimationFrame(put); setTimeout(put,60); });
    }
    document.title = (labelOf(curHash)||'活侠传') + ' · 活侠传百科';
  }
}

function listHash(type,q,offset,facet,facet2){
  let s='#/list/'+enc(type||'');
  const ps=[];
  if(q) ps.push('q='+encodeURIComponent(q));
  if(facet) ps.push('f='+encodeURIComponent(facet));
  if(facet2) ps.push('f2='+encodeURIComponent(facet2));
  if(offset) ps.push('o='+offset);
  return s+(ps.length?('?'+ps.join('&')):'');
}
function ja(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function listGo(type,q,offset,facet,facet2){
  const h=listHash(type,q,offset,facet,facet2);
  if(decodeURIComponent(location.hash.replace(/^#/,''))===decodeURIComponent(h.slice(1))){
    renderList(type,q,offset,facet,facet2); return;

  go(h);
}

function setListSort(k){
  window.LIST_SORT=k;
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  const p=h.split('/');
  if(p[1]==='list'){
    const arg=(p.slice(2).join('/').split('?')[0]||'');

    listGo(arg,qs.get('q')||'',parseInt(qs.get('o')||'0',10)||0,qs.get('f')||'',qs.get('f2')||'');

}

    }
  }
  if(fhits.length){
    h+='<h2>旗标与条件</h2>';
    for(const x of fhits)
      h+=`<div class="hit" onclick="go('#/scene/${enc(x.s)}${x.q?'?seq='+x.q:''}')">
          <div class="h">${esc(x.k||'旗标')} ${esc(x.f)} = ${esc(x.v)}　${esc(x.b||'')}</div>
          <div>${esc(x.t||x.s)}　<span class="mt">${esc(x.s)}</span></div></div>`;
  }
  if(!(d.pages||[]).length && !(d.scenes||[]).length && !(d.lines||[]).length && !fhits.length) h+='<div class="empty">没有结果</div>';
  h+='</div>';
  $('#main').innerHTML=h;
  $('#side').innerHTML='';
}

let ART=null;
async function loadArt(){
  if(ART) return ART;
  ART={p:{},c:{}};
  try{ ART.p=await api('/static/portraits.json'); }catch(e){}
  try{ ART.c=await api('/static/covers.json'); }catch(e){}

async function mapWidget(){
  let m=null;
  try{ m=await api('/static/map_nodes.json'); }catch(e){}
  if(!m||!m.nodes) return '<div class="empty">地图数据缺失（web/map_nodes.json）</div>';
  let h='<div class="mapbox"><img src="'+m.img+'" alt="大地图">';
  for(const w of (m.ways||[]))
    h+=`<i class="mway" style="left:${w.x}%;top:${w.y}%"></i>`;
  for(const n of m.nodes){
    const pos=n.side==='left'?'transform:translate(-100%,-50%) translateX(-11px);text-align:right'
      :n.side==='up'?'transform:translate(-50%,-100%) translateY(-11px)'
      :n.side==='down'?'transform:translate(-50%,0) translateY(11px)'
      :'transform:translateY(-50%) translateX(11px)';
    h+=`<a class="mnode" href="#/p/${enc(n.slug)}" style="left:${n.x}%;top:${n.y}%" title="${esc(n.name)}"></a>`;
    h+=`<span class="mlab" style="left:${n.x}%;top:${n.y}%;${pos}">${esc(n.name)}</span>`;
  }
  h+='</div><div class="mapnote">底图为游戏内行程地图（'+m.w+'×'+m.h+'）。红点为图中可前往之地，'
    +'小点为途程节点。标签位置按图面避让调整，与方位无关。</div>';
  return h;
}

async function renderPage(slug){
  const d=await api('/api/page?slug='+enc(slug));
  const _sd=document.getElementById('side'); if(_sd) _sd.classList.remove('open');
  if(d.error){ $('#main').innerHTML=`<div class="wrap"><div class="empty">未找到条目「${esc(slug)}」<br><br><a href="#/search/${enc(slug.split('/').pop())}">搜索这个词</a> 或 <a href="#/">回首页</a></div></div>`; return; }
  const inf=d.infobox||{};
  let h='<div class="wrap">';
  h+=`<div class="sub" style="margin:0 0 8px">`;
  if(inf["上级"]) h+=`<a href="#/p/${enc(d.type+'/'+inf['上级'])}">← 返回${esc(inf['上级'])}</a>　`;
  h+=`<a href="#/list/${enc(d.type)}">全部${esc(d.type)}</a></div>`;
  if(d.title) h+=`<div class="ttl-badge">${esc(d.title)}</div>`;
  h+=`<h1>${esc(d.name)}</h1><div class="sub"><span class="tag">${esc(d.type)}</span>
      ${d.mentions?d.mentions+' 处提及':''}${d.chapters&&d.chapters.length?' · 首见 '+esc(d.chapters[0]):''}</div>`;
  const _art=await loadArt();
  if(d.type==='人物'&&_art.p[slug]) h+=`<img class="portrait" src="/static/${_art.p[slug]}" alt="${esc(d.name)}">`;
  if(d.type==='书物'&&_art.c[slug]) h+=`<img class="cover" src="/static/${_art.c[slug]}" alt="${esc(d.name)}">`;
  if(Object.keys(inf).length){
    h+='<div class="infobox"><div class="ttl">'+esc(d.name)+'</div>';
    for(const [k,v] of Object.entries(inf))
      h+=`<div class="row"><div class="k">${esc(k)}</div><div class="v">${linkify(String(v))}</div></div>`;
    h+='</div>';
  }
  if(d.lead) h+=`<div class="lead">${fnmark(linkify(d.lead))}</div>`;
  if(d.type==='地图') h+=await mapWidget();
  const SECS=[];
  let _si=0;
  for(const s of (d.sections||[])){
    if(s.h==='简介'){ h+=`<div class="lead">${secHtml(s.html||'')}</div>`; continue; }
    const sid='sec-'+(++_si);
    if(s.h!=='脚注') SECS.push({h:s.h,id:sid});
    h+=`<h2 id="${sid}">${esc(s.h)}</h2>`;
    if(s.notes){
      for(const n of s.notes)
        h+=`<div class="note"><span class="ch">${esc(n.ch)}</span>${linkify(n.text)}
            ${n.ev?`<div class="ev">原文：「${esc(n.ev)}」</div>`:''}</div>`;
    }
    if(s.rows){
      for(const r of s.rows){
        const _sj=(!r.slug && r.script && r.seq)?`?seq=${r.seq}`:'';
        const t=r.slug?`<a class="ch" href="#/p/${enc(r.slug)}">${esc(r.title||r.slug)}</a>`:(r.script?`<a class="ch" href="#/scene/${enc(r.script)}${_sj}">${esc(r.title||r.script)}</a>`:'');
        let nm=r.note||'', fnnum='';
        if(s.h==='脚注'){
          const m=nm.match(/^(\d+)\.\s*/);
          if(m){ fnnum=m[1]; nm=nm.slice(m[0].length); }
        }
        h+=`<div class="note"${fnnum?` id="fn-${fnnum}"`:''}>${t}`;
        if(fnnum) h+=`<sup class="fn">${fnnum}</sup> `;
        h+=linkify(nm);
        if(r.quote){
          h+=`<div class="ev">原文：「${linkify(r.quote)}」`;
          if(r.script){
            const j=r.seq?`?seq=${r.seq}`:'';
            h+=` <a class="ch" href="#/scene/${enc(r.script)}${j}">→ 原文</a>`;
          }
          h+='</div>';
        }
        if(r.routes&&r.routes.length) h+=`<div class="ev">路线：${esc(r.routes.join('、'))}</div>`;
        h+='</div>';
      }
    }
    if(s.choices){
      h+='<div class="brwrap"><table class="br"><thead><tr><th>抉择</th><th>条件</th><th>后果</th></tr></thead><tbody>';
      for(const c of s.choices){
        const fl=(c.flags||[]).map(x=>`${x.f}=${x.v}`).join('、');
        const sc=(c.scenes||[]).join('、');
        const link=c.seq?`<a href="#/scene/${enc(d.infobox&&d.infobox['脚本']||'')}?seq=${c.seq}">第${c.seq}句</a>`:'';
        h+=`<tr><td><b>${esc(c.text||('#'+c.idx))}</b> ${link}</td>
            <td>${esc(c.cond||'')}</td>
            <td>${fl?`<span class="eff">${esc(fl)}</span>`:''}${sc?`<span class="eff">→ ${esc(sc)}</span>`:''}</td></tr>`;
      }
      h+='</tbody></table></div>';
    }
    if(s.choice_rows){
      h+='<div class="brwrap"><table class="br"><thead><tr><th>选项</th><th>解锁条件</th><th>结果</th></tr></thead><tbody>';
      for(const b of s.choice_rows){
        if(b.prompt) h+=`<tr><td colspan="3"><i>${esc(b.prompt).replace(/\\n/g,'<br>')}</i> <span class="sc">${esc(b.scene||'')}</span></td></tr>`;
        if(b.free) h+='<tr><td colspan="3" class="mt">本处选项无附加条件，全部可选</td></tr>';
        for(const o of b.options){
          const _nx=(o.next && !o.terminal)?` <a class="ch" href="#/scene/${enc(o.next)}">→ ${esc(o.next_title||o.next)}</a>`:'';
          h+=`<tr><td><b>${esc(o.text)}</b></td><td>${o.cond?esc(o.cond):'—'}</td><td>${esc(o.result)}${_nx}</td></tr>`;
        }

      h+='</tbody></table></div>';
    }
    if(s.people){
      h+='<div>';
      for(const p of s.people)
        h+=`<a class="chip" href="#/p/${enc('人物/'+p.name)}">${esc(p.name)}<span class="n">${p.n}</span></a>`;
      h+='</div>';
    }
    if(s.html && s.h!=='简介') h+=`<div>${secHtml(s.html)}</div>`;
  }
  const L=d.links||[], groups={};
  for(const x of L) (groups[x.kind]=groups[x.kind]||[]).push(x);
  if(groups['关系']){
    h+='<h2>关系</h2>';
    for(const r of groups['关系'])
      h+=`<div class="rel"><div class="k"><a href="#/p/${enc(r.dst)}">${esc(r.name||r.dst.split('/').pop())}</a></div>
          <div class="v">${esc(r.label||'')}</div></div>`;
  }
  if(groups['归属']){
    h+='<h2>归属</h2><div>';
    for(const r of groups['归属'])
      h+=`<a class="chip" href="#/p/${enc(r.dst)}">${esc(r.name||r.dst.split('/').pop())}</a>`;
    h+='</div>';
  }
  for(const [kind,label,cap] of [['成员','成员',60],
                                 ['发生地','发生地',5],['出场','出场场景',30],['出场场景','出场场景',30]]){
    if(!groups[kind]) continue;
    h+=`<h2>${label}</h2><div>`;
    groups[kind].slice(0,cap).forEach(r=>{
      const nm=r.name||r.dst.split('/').pop();
      h+=`<a class="chip" href="#/p/${enc(r.dst)}">${esc(nm)}${r.label?`<span class="n">${esc(r.label)}</span>`:''}</a>`;
    });
    if(groups[kind].length>cap) h+=`<span class="chip">…共 ${groups[kind].length} 条</span>`;
    h+='</div>';
  }
  if(d.type==='场景' && d.infobox && d.infobox['脚本']){
    h+='<h2>对话</h2><div class="bar"><button onclick="document.querySelectorAll(\'#pgd details.br\').forEach(x=>x.open=true)">展开全部分支</button><button onclick="document.querySelectorAll(\'#pgd details.br\').forEach(x=>x.open=false)">全部折叠</button></div><div id="pgd">';
    try{
      const sc=await api('/api/scene?script='+enc(d.infobox['脚本']));
      if(sc&&sc.lines&&sc.lines.length){
        const cs={};sc.choices.forEach(x=>cs[x.seq]=x);
        const fl={};sc.flags.forEach(f=>{(fl[f.seq]=fl[f.seq]||[]).push(f);});
        let i=0;
        while(i<sc.lines.length){
          const b=sc.lines[i].branch||'';
          let j=i; while(j<sc.lines.length&&(sc.lines[j].branch||'')===b) j++;
          const body=sc.lines.slice(i,j).map(l=>lineHtml(l,cs,fl)).join('');
          if(b) h+=`<details class="br"><summary title="${esc(b)}">${esc(shortBr(b))}</summary><div class="body">${body}</div></details>`;
          else h+=body;
          i=j;
        }
      }
    }catch(e){}
    h+='</div>';
    h+=`<div class="bar"><button onclick="go('#/scene/${enc(d.infobox['脚本'])}')">读这一场原文</button></div>`;
  }
  const back=(d.backlinks||[]).filter(x=>x.kind!=='出场场景');
  if(back.length){
    h+='<h2>链入页面</h2><div>';
    const seen=new Set();
    for(const b of back){
      const nm=b.name||b.src.split('/').pop();
      const key=b.src;
      if(seen.has(key)) continue;
      seen.add(key);
      if(seen.size>40) break;
      h+=`<a class="chip" href="#/p/${enc(b.src)}">${esc(nm)}<span class="n">${esc(b.kind)}</span></a>`;
    }
    if(back.length>40) h+=`<span class="chip">…共 ${back.length} 条</span>`;
    h+='</div>';
  }
  if(d.cats&&d.cats.length){
    h+='<div class="cats">分类：';
    for(const c of d.cats){
      const typ=['人物','势力','地点','事件','地图事件','书物','物品','武学','成就','装备','场景'].includes(c);
      h+=typ?`<a class="tag" href="#/list/${enc(c)}">${esc(c)}</a>`:`<span class="tag">${esc(c)}</span>`;
    }
    h+='</div>';
  }
  h+='</div>';
  $('#main').innerHTML=h;
  renderSideFor(d,SECS);
}

function lineHtml(l,cs,fl){
  let extra='';
  const c=cs[l.seq];
  if(c){
    let req='';
    if(c.title) req+=`<span class="cond">判定：${esc(c.title)}</span>`;
    if(c.requires&&c.requires.length) req+=c.requires.map(r=>`<span class="cond">出现条件：${esc(r)}</span>`).join('');
    if(c.cond_text&&c.cond_text.length) req+=c.cond_text.map(r=>`<span class="cond">属性检定：${esc(r)}</span>`).join('');
    const opts=(c.options||[]).map(o=>{
      const name=o.text||o.label||o.key||'';
      return `<span class="opt"><b>${esc(name)}</b>${o.cond?' → 掷骰 '+esc(o.cond):''}</span>`;
    }).join('');
    extra+=`<div class="choice"><div class="ch">◆ ${esc(c.checkpoint)}</div>${req}
      <div style="margin-top:6px">${opts||'<span class="cond">（此判定无预设选项文案）</span>'}</div></div>`;
  }
  if(fl[l.seq]) extra+=`<div class="flagline">⤷ ${fl[l.seq].map(f=>`<span class="opt">${esc(f.flag)} = ${esc(f.value)}</span>`).join('')}</div>`;
  return `<div class="line ${cls(l.mode)}" data-seq="${l.seq}">
      <div class="sp">${TITLES[l.speaker]?`<i class="spt">${esc(TITLES[l.speaker])}</i>`:''}${esc(l.speaker)}<span>${badge(l.mode)}</span></div>
      <div class="tx">${rich(l.text)||'<i style="color:#5b616b">（缺文本）</i>'}<span class="key">${esc(l.key)}</span></div>
    </div>`+extra;
}
function shortBr(b){ const a=(b||'').split(/\s+(?:›|>)\s+/); return a.length>2?'… › '+a.slice(-2).join(' › '):b; }

async function renderScene(sid,jump){
  const [script,qs]=String(sid).split('?');
  if(!jump && qs){ const m=new URLSearchParams(qs).get('seq'); if(m) jump=m; }
  const d=await api('/api/scene?script='+enc(script));
  if(!d.scene) { $('#main').innerHTML='<div class="wrap"><div class="empty">场景不存在</div></div>'; return; }
  const cs={},fl={};
  d.choices.forEach(c=>cs[c.seq]=c);
  d.flags.forEach(f=>{(fl[f.seq]=fl[f.seq]||[]).push(f);});
  const brs=d.branches||{};
  TITLES=d.titles||{};
  let h=`<div class="wrap"><h1>${esc(d.scene.title||d.scene.script)}</h1>
    <div class="sub"><span class="tag">${esc(d.scene.chapter)}</span>
    <a href="#/p/${enc('场景/'+d.scene.script)}">场景条目</a> · ${d.scene.line_count} 句 · ${d.scene.cjk} 字</div>`;
  if(d.scene.place) h+=`<div class="sub">地点：<a href="#/p/${enc('地点/'+d.scene.place)}">${esc(d.scene.place)}</a></div>`;
  if(d.participants&&d.participants.length)
    h+='<div class="sub">参与：'+d.participants.map(p=>`<span class="chip">${esc(p.nm)} ${p.n}</span>`).join('')+'</div>';
  h+=`<div class="bar"><button id="exp">展开全部分支</button><button id="col">全部折叠</button></div>`;
  let i=0,out='';
  while(i<d.lines.length){
    const b=d.lines[i].branch_h||d.lines[i].branch||'';
    let j=i; while(j<d.lines.length && (d.lines[j].branch_h||d.lines[j].branch||'')===b) j++;
    const body=d.lines.slice(i,j).map(l=>lineHtml(l,cs,fl)).join('');
    if(b){
      out+=`<details class="br"><summary title="${esc(b)}">${esc(shortBr(b))}</summary><div class="body">${body}</div></details>`;
    } else out+=body;
    i=j;
  }
  $('#main').innerHTML=h+out+'</div>';
  $('#side').innerHTML='';
  if(jump){
    const el=$('#main').querySelector('.line[data-seq="'+jump+'"]');
    if(el){ let p=el.parentElement; while(p&&p!==$('#main')){ if(p.tagName==='DETAILS') p.open=true; p=p.parentElement; }
      el.scrollIntoView({block:'center'}); el.style.background='#3a2f1d'; }
  }
  $('#exp').onclick=()=>document.querySelectorAll('details.br').forEach(x=>x.open=true);
  $('#col').onclick=()=>document.querySelectorAll('details.br').forEach(x=>x.open=false);
}

<script>
(async function(){
  try{const v=await api('/api/appver'); if(v&&v.version) document.getElementById('uver').textContent=v.version;}catch(e){}
  const chip=document.getElementById('updchip');
  if(!chip) return;
  chip.onclick=async function(){
    const old=chip.innerHTML; chip.textContent='检查中…';
    try{
      const d=await api('/api/update/check');
      if(d&&d.newer){
        if(confirm('发现新版本 '+d.version+'（当前 '+d.current+'）\n\n'+(d.notes||d.version)+'\n\n现在下载并更新？')){
          chip.textContent='正在下载…';
          const r=await api('/api/update/apply');
          chip.textContent=(r&&r.ok)?'更新中，程序会自动重启':'更新失败';
        }else{ chip.innerHTML=old; }
      }else if(d&&d.ok){
        alert('已是最新版本 '+d.current); chip.innerHTML=old;
      }else{
        alert('暂时无法检查更新（未配置清单或网络不通）'); chip.innerHTML=old;
      }
    }catch(e){ alert('检查更新失败：'+e); chip.innerHTML=old; }
  };
})();
</script>
<div class="sgbtn" onclick="suggestOpen()">修订建议</div>
</body>
</html>
